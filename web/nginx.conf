server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Metering sub-paths of a customer go to the metronome service. This regex is
    # evaluated before the /v1/ prefix, so the customer registry (/v1/customers,
    # /v1/customers/{id}) still falls through to billing below.
    location ~ ^/v1/customers/[^/]+/(usage|close-period)$ {
        proxy_pass http://metronome:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Invoice sub-paths of a customer go to the invoicing service.
    location ~ ^/v1/customers/[^/]+/(invoices|upcoming-invoice)$ {
        proxy_pass http://invoicing:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Generator resources — proxied directly to the control plane service.
    location /v1/generators {
        proxy_pass http://controlplane:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fixed subscription plan price (read-only) — served by the invoicing service.
    location = /v1/subscription-plan {
        proxy_pass http://invoicing:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Billing API — proxied to the billing service on the internal network.
    location /v1/ {
        proxy_pass http://billing:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
