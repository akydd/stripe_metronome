# Rate limiting (per client IP). The API is intentionally public and
# unauthenticated for the demo, so these caps are the main defense against abuse
# (floods / scripted usage) on the small instance. Limits sit well above what the
# frontend's polling needs; excess requests get 429 rather than the default 503.
# The daily 00:00 UTC reset cleans up any mess that slips through.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# `emit` fabricates up to thousands of usage events per call, so it's the biggest
# abuse vector and gets a tighter cap of its own.
limit_req_zone $binary_remote_addr zone=emit:10m rate=1r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Metering sub-paths of a customer go to the metering service. This regex is
    # evaluated before the /v1/ prefix, so the customer registry (/v1/customers,
    # /v1/customers/{id}) still falls through to billing below.
    location ~ ^/v1/customers/[^/]+/(usage|close-period)$ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://metering:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Invoice sub-paths of a customer go to the invoicing service.
    location ~ ^/v1/customers/[^/]+/(invoices|upcoming-invoice)$ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://invoicing:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Usage-event fabrication — tighter cap (see the emit zone above). Regex, so it
    # wins over the /v1/generators prefix below.
    location ~ ^/v1/generators/[^/]+/emit$ {
        limit_req zone=emit burst=5 nodelay;
        proxy_pass http://controlplane:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Generator resources — proxied directly to the control plane service.
    location /v1/generators {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://controlplane:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fixed subscription plan price (read-only) — served by the invoicing service.
    location = /v1/subscription-plan {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://invoicing:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Read-only live event feed — served by the eventfeed service. More specific
    # than /v1/ below, so it wins the prefix match.
    location /v1/events {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://eventfeed:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Billing API — proxied to the billing service on the internal network.
    location /v1/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://billing:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA + static assets (not rate limited — a page load pulls many files at once).
    location / {
        try_files $uri /index.html;
    }
}
